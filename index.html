<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Launcher</title>
<style>
  body { font-family: system-ui, sans-serif; background:#313338; color:#f2f3f5; display:flex; min-height:100vh; margin:0; align-items:center; justify-content:center; }
  main { text-align:center; padding:2rem; max-width:32rem; }
  a.btn { display:inline-block; margin:.5rem; padding:.8rem 1.4rem; background:#5865f2; color:#fff; border-radius:.5rem; text-decoration:none; font-weight:600; }
  a.btn:hover { background:#4752c4; }
  p { color:#b5bac1; }
</style>
</head>
<body>
<main>
  <h1>Discord</h1>
  <p>Open Discord in your browser.</p>
  <a class="btn" href="https://discord.com/app" target="_blank" rel="noopener">Open Discord Web App</a>
  <a class="btn" href="https://discord.com/login" target="_blank" rel="noopener">Log in</a>
  <a class="btn" href="https://discord.com" target="_blank" rel="noopener">discord.com</a>
  <p><small>Discord can't be embedded in a page (it blocks framing), so these links open it in a new tab.</small></p>
</main>
</body>
</html>
