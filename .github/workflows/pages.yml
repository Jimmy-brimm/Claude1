name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version so browsers load the new game after every deploy
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -e "s|href=\"style.css\"|href=\"style.css?v=$v\"|" \
                 -e "s|src=\"config.js\"|src=\"config.js?v=$v\"|" \
                 -e "s|src=\"game.js\"|src=\"game.js?v=$v\"|" \
                 -e "s|<span id=\"build\">dev</span>|<span id=\"build\">$v</span>|" index.html
          grep -q "game.js?v=$v" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
